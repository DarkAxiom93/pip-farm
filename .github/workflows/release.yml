# When package.json gets a new version on main, build the Windows installer and publish it as a GitHub Release.
# Installed copies of the game check these releases and update themselves.
name: release
on:
  push:
    branches: ["main"]
    paths: ["package.json", ".github/workflows/release.yml"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: is this version already released?
        id: check
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          v="v$(node -p "require('./package.json').version")"
          echo "tag=$v" >> "$GITHUB_OUTPUT"
          if gh release view "$v" --json assets -q '.assets[].name' 2>/dev/null | grep -qx latest.yml; then
            echo "new=false" >> "$GITHUB_OUTPUT"; echo "$v already released"
          else
            # a half-finished release (no latest.yml) would break auto-update, so remove it and build again
            gh release delete "$v" --cleanup-tag -y 2>/dev/null || true
            echo "new=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@v4
        if: steps.check.outputs.new == 'true'
        with:
          node-version: 22
          cache: npm
      - if: steps.check.outputs.new == 'true'
        run: npm ci
      - if: steps.check.outputs.new == 'true'
        run: npm run typecheck
      # build without publishing, then create the release in one step (electron-builder's own
      # publishing races itself when it creates the release and fails with 422)
      - if: steps.check.outputs.new == 'true'
        shell: bash
        run: set -o pipefail; npm run dist 2>&1 | tee release.log
      - if: steps.check.outputs.new == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -o pipefail
          v="${{ steps.check.outputs.tag }}"
          ls dist
          gh release create "$v" dist/PipFarm-Setup-*.exe dist/PipFarm-Setup-*.exe.blockmap dist/latest.yml \
            --target "$GITHUB_SHA" --title "חוות הפיפים $v" \
            --notes "להתקנה ראשונה: להוריד את PipFarm-Setup ולהפעיל. מי שכבר מותקן אצלו מקבל את הגרסה לבד." 2>&1 | tee -a release.log
      # if the build fails, leave the end of the log as a comment on the commit so it is easy to read
      - if: failure()
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          { echo '```'; tail -n 60 release.log 2>/dev/null || echo "no log"; echo '```'; } > comment.md
          gh api "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/comments" -F body=@comment.md
