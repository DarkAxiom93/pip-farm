# Type-check and run the browser tests on every push.
name: test
on:
  push:
    branches: ["main"]
  pull_request:
permissions:
  contents: write
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: npm ci
      - run: npm run typecheck
      - run: pip install playwright && python -m playwright install --with-deps chromium
      - name: browser tests
        shell: bash
        run: set -o pipefail; npm test 2>&1 | tee test.log
      # on failure, leave the failing lines as a comment on the commit so they are easy to read
      - if: failure()
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          { echo '```'; grep -a -E 'FAIL|^==|Error|Traceback' test.log | tail -n 40 || echo "no log"; echo '```'; } > comment.md
          gh api "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/comments" -F body=@comment.md
