<!doctype html>
<html lang="he" dir="rtl"><head><meta charset="utf-8"><title>חברים על שולחן העבודה</title>
<style>
html,body{margin:0;height:100%;background:transparent;overflow:hidden}
canvas{display:block;width:100%;height:100%;image-rendering:pixelated}
.tag{position:absolute;transform:translate(-50%,-100%);font:700 13px system-ui,"Segoe UI",sans-serif;direction:rtl;white-space:nowrap;pointer-events:none;
  background:#e3f1ff;color:#2a1830;border-radius:10px;padding:2px 8px;box-shadow:0 1px 0 rgba(0,0,0,.25)}
.menu{position:absolute;transform:translate(-50%,-100%);display:flex;gap:4px;background:#2a1f33;border:2px solid #8a6a45;border-radius:10px;padding:4px;direction:rtl;font:600 13px system-ui,"Segoe UI",sans-serif}
.menu button{background:#3d2f4a;color:#f5eddc;border:0;border-radius:7px;padding:4px 8px;font:inherit;cursor:pointer;white-space:nowrap}
.menu button:hover{background:#5a4670}
.menu button:disabled{opacity:.45;cursor:default}
.tag.sign{background:#f5eddc;border:2px solid #8a6a45;border-radius:4px;padding:3px 9px;font-size:14px}
</style></head><body>
<canvas id="c"></canvas>
<script>
// The pips live along the bottom of the screen, above the taskbar, even when the farm window is closed.
// - they walk, nap at night, and show what they need; click one to answer it, double-click to open the farm
// - they notice the mouse: they look at it, hop when it comes close, and you can pick one up and drop it
// - they notice you: while you work they sit and watch, when you are away for a while they nap or play tag
// - now and then one says a word in their language
// - after a long stretch at the computer, one of them holds up a sign for a short break
const S=3,c=document.getElementById("c"),g=c.getContext("2d");
let W=0,H=0;
function size(){W=Math.floor(innerWidth/S);H=Math.floor(innerHeight/S);c.width=W;c.height=H;g.imageSmoothingEnabled=false}
addEventListener("resize",size);size();
const R=(x,y,w,h,col)=>{g.fillStyle=col;g.fillRect(Math.round(x),Math.round(y),w,h)};
const rand=(a,b)=>a+Math.random()*(b-a),pick=a=>a[Math.floor(Math.random()*a.length)];
let snap={pips:[]},walkers=new Map(),AC=null,mouse={x:-99,y:-99,t:0},idle=0,breakSign=null,drag=null,lastHover=0;

function pickShown(){
  const list=snap.pips||[],needy=list.filter(p=>p.need),rest=list.filter(p=>!p.need);
  return [...needy,...rest].slice(0,Math.min(10,Math.max(3,Math.floor(W/40))));
}
pipDesktop.onSnapshot(s=>{
  snap=s||{pips:[]};
  const shown=pickShown(),ids=new Set(shown.map(p=>p.id));
  for(const id of [...walkers.keys()])if(!ids.has(id)&&(!drag||drag.w.p.id!==id)){const w=walkers.get(id);if(w.el)w.el.remove();walkers.delete(id)}
  for(const p of shown){
    let w=walkers.get(p.id);
    if(!w){w={x:rand(10,W-10),y:0,vy:0,tx:0,dir:1,wait:rand(0,3),hop:0,anim:rand(0,9),say:null,sayT:0,nextSay:rand(8,30),mode:"walk"};w.tx=w.x;walkers.set(p.id,w)}
    w.p=p;
  }
});
pipDesktop.onActivity&&pipDesktop.onActivity(a=>{idle=a.idle||0});
pipDesktop.onBreak&&pipDesktop.onBreak(()=>{const w=pick([...walkers.values()].filter(w=>!w.p.sleep));if(w){breakSign={w,t:0};w.tx=W/2;w.say=null}});

function tone(f,d,type,vol){try{if(!AC)AC=new AudioContext();const t=AC.currentTime,o=AC.createOscillator(),v=AC.createGain();o.type=type||"triangle";o.frequency.setValueAtTime(f,t);o.frequency.exponentialRampToValueAtTime(f*1.5,t+d*.8);v.gain.setValueAtTime(.0001,t);v.gain.exponentialRampToValueAtTime(vol||.1,t+.01);v.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(v);v.connect(AC.destination);o.start(t);o.stop(t+d+.05)}catch(_){}}
const chirp=p=>tone(500+(p.hue%200),.15,"triangle",.12);

function drawPip(w,t){
  const p=w.p,gg=p.g||{},sz=gg.size===1?-1:gg.size===2?2:0,sh=gg.shape||0,base=H-2-w.y,bw=Math.max(6,(gg.body?11:9)+sz+(sh===2?2:sh===1?-1:0)),bh=Math.max(5,bw-1+(sh===1?3:sh===2?-2:0));
  const hop=w.hop>0?Math.abs(Math.sin(w.hop*12))*6:(w.moving?Math.abs(Math.sin(w.anim*11))*1.5:0);
  const x0=Math.round(w.x-bw/2),y0=Math.round(base-bh-hop);
  const hue=p.mut==="rainbow"?(p.hue+t*70)%360:p.hue,sat=p.elder?45:80;
  const C=l=>p.mut==="gold"?`hsl(46,92%,${l}%)`:`hsl(${hue},${sat}%,${l}%)`;
  if(w.y<2)R(w.x-bw/2+1,H-3,bw-2,2,"rgba(0,0,0,.25)");else R(w.x-bw/2+2,H-3,bw-4,1,"rgba(0,0,0,.15)");
  if(p.mut==="glow"){R(x0-2,y0-2,bw+4,bh+4,`hsla(${hue},100%,82%,${.2+.15*Math.sin(t*3)})`)}
  if(p.mut==="wings"){const f=Math.floor(t*9)%2;R(x0-3,y0+1-f,3,2+f,"#eef7ff");R(x0+bw,y0+1-f,3,2+f,"#eef7ff")}
  const ds=p.ds||0,dc=p.dc||"#5dffb0";
  if(ds>=4)g.globalAlpha=.72;
  R(x0,y0-1,bw,bh+2,C(24));R(x0-1,y0,bw+2,bh,C(24));
  R(x0+1,y0,bw-2,bh,C(72));R(x0,y0+1,bw,bh-2,C(72));R(x0+1,y0+bh-2,bw-2,2,C(52));R(x0+1,y0+1,2,1,C(86));
  g.globalAlpha=1;
  drawDigital(w,p,ds,dc,x0,y0,bw,bh,t);
  const cx=x0+(bw>>1),acc=p.mut==="gold"?"hsl(36,90%,45%)":`hsl(${p.hue2??hue+150},72%,58%)`,eyeC=["#2a1830","#1f3f9f","#9a1f3a","#1f7a44"][gg.eyec||0];
  if(sh===3){R(cx-1,y0-2,3,1,C(24));R(cx-1,y0-1,3,1,C(72))}
  if(gg.pattern===1){R(x0+1,y0+bh-4,2,2,acc);R(x0+bw-3,y0+2,2,2,acc)}
  else if(gg.pattern===2){R(x0+1,y0,bw-2,1,acc);R(x0,y0+1,bw,1,acc)}
  else if(gg.pattern===3){R(cx-2,y0+bh-3,4,2,C(86))}
  if(p.sprout===0){R(cx,y0-2,1,2,"#3f8f3a");R(cx-2,y0-3,2,1,"#6fcf5a");R(cx+1,y0-4,2,1,"#6fcf5a")}
  else if(p.sprout===1){R(x0+1,y0-2,2,2,C(72));R(x0+bw-3,y0-2,2,2,C(72))}
  else if(p.sprout===2){R(cx,y0-3,1,3,C(52));R(cx-1,y0-5,3,2,C(86))}
  else if(p.sprout===4){R(cx-1,y0-3,3,1,"#ff9db5");R(cx,y0-4,1,3,"#ff9db5")}
  else if(p.sprout===5){R(x0+1,y0-2,1,2,"#f5eddc");R(x0+bw-2,y0-2,1,2,"#f5eddc")}
  else{R(cx,y0-2,1,2,C(52))}
  // eyes follow the mouse when it is near
  let off=w.dir>0?1:0,lookUp=0;
  const mx=mouse.x/S,my=mouse.y/S;if(performance.now()-mouse.t<3000&&Math.abs(mx-w.x)<50){off=mx>w.x?1:0;lookUp=my<y0?-1:0}
  const ey=y0+3+lookUp,el=cx-2+off,er=cx+1+off;
  const asleep=p.sleep||w.mode==="nap";
  if(asleep){R(el,ey+1,2,1,eyeC);R(er,ey+1,2,1,eyeC);if(Math.sin(t*2+w.anim)>.6)R(x0+bw+1,y0-3-Math.round((t*4+w.anim)%4),2,1,"#cfe0ff")}
  else if(Math.sin(t*1.3+w.anim)>.97){R(el,ey+1,1,1,eyeC);R(er,ey+1,1,1,eyeC)}
  else if(ds>=3){R(el,ey,2,2,"#0b1612");R(er,ey,2,2,"#0b1612");R(el,ey,1,1,dc);R(er,ey,1,1,dc)}
  else{R(el,ey,1,2,eyeC);R(er,ey,1,2,eyeC);R(el,ey,1,1,"#fff")}
  if(p.mood>55&&!asleep){R(el-1,ey+2,1,1,"#ff9db5");R(er+1,ey+2,1,1,"#ff9db5")}
  if(p.elder){R(cx-2+off,ey+3,4,2,"#f4f1ea")}
  if(snap.season==="winter")R(x0,y0+bh-4,bw,1,"#e8433f");
  if(p.need){
    const ny=y0-12+Math.round(Math.sin(t*4)*1),nx=w.x+2;
    R(nx-3,ny-3,7,7,"#f5eddc");R(nx-4,ny-2,9,5,"#f5eddc");R(nx-1,ny+4,2,2,"#f5eddc");
    const col={food:"#ff5d73",pet:"#ff7aa2",play:"#8fbfff",talk:"#2a1830"}[p.need];
    if(p.need==="talk"){R(nx-2,ny,1,1,col);R(nx,ny,1,1,col);R(nx+2,ny,1,1,col)}
    else if(p.need==="pet"){R(nx-2,ny-1,2,1,col);R(nx+1,ny-1,2,1,col);R(nx-2,ny,5,1,col);R(nx-1,ny+1,3,1,col);R(nx,ny+2,1,1,col)}
    else{R(nx-1,ny-1,3,3,col);if(p.need==="food")R(nx,ny-2,1,1,"#6fcf5a")}
  }
  // words and the break sign are real text on top, so Hebrew stays sharp
  const sign=breakSign&&breakSign.w===w,text=sign?"הפסקה? 💧":(!p.need&&w.say)||null;
  if(sign)R(w.x,y0-12,1,12,"#8a6a45");
  if(text){if(!w.el){w.el=document.createElement("div");document.body.appendChild(w.el)}w.el.className="tag"+(sign?" sign":"");w.el.textContent=text;w.el.style.left=(w.x*S)+"px";w.el.style.top=((y0-(sign?12:3))*S)+"px";w.el.hidden=false}
  else if(w.el)w.el.hidden=true;
}
// the digital look, same stages as in the farm: a glowing pixel, a module, pixel eyes (above), a see-through node
function drawDigital(w,p,ds,dc,x0,y0,bw,bh,t){
  if(ds<1)return;
  const px=x0+2+((p.hue|0)%Math.max(1,bw-4)),py=y0+bh-3,on=Math.sin(t*3+w.anim)>-.2;
  R(px,py,1,1,on?dc:"rgba(0,0,0,.25)");
  if(ds>=2){const m=p.dmod||0;
    if(m===0){const st=w.moving?Math.floor(w.anim*10)%2:0;R(x0+1+st,y0+bh,2,1,"#8a93a6");R(x0+bw-3-st,y0+bh,2,1,"#8a93a6")}
    else if(m===1){const cx=w.dir>0?x0+bw-1:x0-2;R(cx,y0+bh-5,3,3,"#1c2230");R(cx+1,y0+bh-4,1,1,Math.sin(t*5)>0?dc:"#5a4a1a")}
    else{const ax=x0+(w.dir>0?1:bw-2);R(ax,y0-4,1,4,"#8a93a6");R(ax,y0-5,1,1,Math.sin(t*4)>0?dc:"#5e4a80")}}
  if(ds>=4){for(let i=1;i<bh;i+=2){g.globalAlpha=.2;R(x0+1,y0+i,bw-2,1,"#c8ffe6");g.globalAlpha=1}
    if(w.moving&&Math.random()<.3)trail.push({x:w.x+rand(-2,2),y:H-3-w.y-rand(0,5),c:dc,l:.6})}
}
let trail=[];
function drawNet(t){
  // once the network is big enough it reaches the desktop: a circuit line under the pips
  const n=snap.net||0;if(n<10)return;
  g.globalAlpha=Math.min(.5,.15+n/250);R(0,H-1,W,1,"#5dffb0");g.globalAlpha=1;
  const k=Math.max(1,Math.floor(n/25));for(let i=0;i<k;i++){const x=((t*40+i*W/k)%W);R(x,H-1,2,1,"#d6ffe9")}
}
// ---------- things to do with them on the desktop ----------
// right-click a pip: pet it, feed it from the basket, throw it a ball, or open it in the farm
let menu=null,ball=null,fx=[];
function closeMenu(){if(menu){menu.el.remove();menu=null;setOver(!!drag)}}
function openMenu(w){
  closeMenu();const el=document.createElement("div");el.className="menu";
  const fed=(snap.basket||0)>0;
  el.innerHTML=`<button data-m="pet">💕 ללטף</button><button data-m="feed" ${fed?"":"disabled"} title="${fed?"":"הסל ריק"}">🍏 להאכיל</button><button data-m="ball">⚽ כדור</button><button data-m="open">🏠 לחווה</button>`;
  const base=H-2-w.y;el.style.left=Math.max(110,Math.min(innerWidth-110,w.x*S))+"px";el.style.top=((base-16)*S)+"px";
  el.addEventListener("mousedown",e=>e.stopPropagation());
  el.addEventListener("click",e=>{const b=e.target.closest("button");if(!b||b.disabled)return;doMenu(b.dataset.m,w);closeMenu()});
  let shut=setTimeout(closeMenu,6000);
  el.addEventListener("mouseenter",()=>{setOver(true);clearTimeout(shut)});
  el.addEventListener("mouseleave",()=>{shut=setTimeout(closeMenu,2000)});
  document.body.appendChild(el);menu={el,w};setOver(true);
}
function doMenu(k,w){
  const p=w.p;
  if(k==="pet"){w.hop=.6;for(let i=0;i<5;i++)fx.push({k:"heart",x:w.x+rand(-4,4),y:H-14-w.y-rand(0,6),vy:-rand(8,14),l:1.4});tone(880,.12,"sine",.1);setTimeout(()=>tone(1175,.15,"sine",.1),120);pipDesktop.buddyCommand({type:"pet",id:p.id});if(p.need==="pet")p.need=null}
  else if(k==="feed"){w.hop=.3;w.eat=1.4;for(let i=0;i<6;i++)fx.push({k:"bit",x:w.x+w.dir*4,y:H-8-w.y,vx:rand(-10,10),vy:-rand(10,25),l:.8});tone(660,.06,"square",.06);setTimeout(()=>tone(990,.06,"square",.06),80);pipDesktop.buddyCommand({type:"feed",id:p.id});if(p.need==="food")p.need=null;snap.basket=Math.max(0,(snap.basket||0)-1)}
  else if(k==="ball"){spawnBall(w.x+w.dir*10,24)}
  else if(k==="open")pipDesktop.buddyCommand({type:"open",id:p.id});
}
function spawnBall(x,h){ball={x,h,vx:rand(-20,20),vh:0,spin:0,idle:0};tone(520,.1,"triangle",.1)}
function ballTick(dt,list){
  if(!ball)return;const b=ball;
  if(!(drag&&drag.ball)){b.vh-=260*dt;b.h+=b.vh*dt;b.x+=b.vx*dt;b.spin+=b.vx*dt*.4;
    if(b.h<=0){b.h=0;if(b.vh<-40){b.vh=-b.vh*.55;tone(300,.05,"sine",.05)}else b.vh=0;b.vx*=Math.pow(.25,dt)}
    if(b.x<3){b.x=3;b.vx=Math.abs(b.vx)*.7}if(b.x>W-3){b.x=W-3;b.vx=-Math.abs(b.vx)*.7}}
  b.idle+=dt;if(Math.abs(b.vx)>3||b.h>0)b.idle=0;
  if(b.idle>40){for(let i=0;i<6;i++)fx.push({k:"bit",x:b.x,y:H-4,vx:rand(-15,15),vy:-rand(10,30),l:.7});ball=null;return}
  // awake pips chase it and kick it
  for(const w of list){if(w.p.sleep||w.mode==="nap"||(drag&&drag.w===w))continue;
    const d=b.x-w.x;if(Math.abs(d)<60||w.chase){w.chase=true;w.tx=b.x-Math.sign(d||1)*3;w.wait=1}
    if(Math.abs(d)<5&&b.h<4&&(w.kickCd||0)<=0){w.kickCd=.8;const dir=d>=0?1:-1;b.vx=dir*rand(50,110);b.vh=rand(60,120);w.hop=.4;w.dir=dir;tone(400+((w.p.hue|0)%300),.08,"triangle",.1);pipDesktop.buddyCommand({type:"kick",id:w.p.id})}
    w.kickCd=(w.kickCd||0)-dt;}
}
function drawBall(t){
  if(!ball)return;const x=ball.x,y=H-3-ball.h;
  g.globalAlpha=.25;R(x-2,H-2,5,1,"#000");g.globalAlpha=1;
  R(x-2,y-4,5,5,"#f5eddc");R(x-3,y-3,7,3,"#f5eddc");R(x-1,y-5,3,1,"#f5eddc");R(x-1,y+1,3,1,"#f5eddc");
  const k=Math.floor(ball.spin)&3;R(x-1+(k&1),y-3+(k>>1),2,2,"#2a1830");R(x+2-(k&1),y-1,1,1,"#2a1830");
}
function fxTick(dt){
  for(let i=fx.length-1;i>=0;i--){const q=fx[i];q.l-=dt;q.y+=q.vy*dt;if(q.vx)q.x+=q.vx*dt;if(q.k==="bit")q.vy+=60*dt;if(q.l<=0){fx.splice(i,1);continue}
    g.globalAlpha=Math.min(1,q.l);
    if(q.k==="heart"){R(q.x-1,q.y,1,1,"#ff7aa2");R(q.x+1,q.y,1,1,"#ff7aa2");R(q.x-1,q.y+1,3,1,"#ff7aa2");R(q.x,q.y+2,1,1,"#ff7aa2")}
    else R(q.x,q.y,1,1,"#5dffb0");
    g.globalAlpha=1}
}
let last=performance.now(),tagT=0;
function frame(now){
  const dt=Math.min(.1,(now-last)/1000);last=now;const t=now/1000;
  g.clearRect(0,0,W,H);
  drawNet(t);
  ballTick(dt,[...walkers.values()]);drawBall(t);
  for(let i=trail.length-1;i>=0;i--){const q=trail[i];q.l-=dt;q.y-=dt*6;if(q.l<=0){trail.splice(i,1);continue}g.globalAlpha=q.l/.6;R(q.x,q.y,1,1,q.c);g.globalAlpha=1}
  const working=idle<5,away=idle>300,list=[...walkers.values()];
  if(away){tagT+=dt}else tagT=0;
  for(const w of list){
    w.anim+=dt;if(w.hop>0)w.hop=Math.max(0,w.hop-dt);
    if(w.sayT>0){w.sayT-=dt;if(w.sayT<=0)w.say=null}
    if(drag&&drag.w===w){w.x=mouse.x/S;w.y=Math.max(0,H-2-mouse.y/S+4);w.vy=0;w.moving=false;drawPip(w,t);continue}
    // falling back to the ground after being dropped
    if(w.y>0||w.vy){w.vy-=220*dt;w.y+=w.vy*dt;if(w.y<=0){w.y=0;if(w.vy<-60){w.vy=-w.vy*.35;chirp(w.p)}else w.vy=0}}
    if(w.p.sleep){w.moving=false;w.mode="walk"}
    else if(breakSign&&breakSign.w===w){const d=W/2-w.x;w.moving=Math.abs(d)>1;if(w.moving){w.dir=d>0?1:-1;w.x+=Math.sign(d)*Math.min(Math.abs(d),20*dt)}}
    else if(away&&tagT>20){
      // the keeper is away: some nap, some play tag
      if(w.mode==="walk")w.mode=Math.random()<.5?"nap":"tag";
      if(w.mode==="tag"){const other=list.find(o=>o!==w&&o.mode==="tag");if(other){const d=other.x-w.x+Math.sin(t+w.anim)*30;w.moving=true;w.dir=d>0?1:-1;w.x+=Math.sign(d)*Math.min(Math.abs(d),28*dt);if(Math.random()<dt*.6)w.hop=.4}}
      else w.moving=false;
    }else{
      if(w.mode!=="walk")w.mode="walk";
      const d=w.tx-w.x;
      if(Math.abs(d)<1){w.moving=false;w.wait-=dt*(working?.35:1);if(w.wait<=0){w.tx=Math.max(8,Math.min(W-8,w.x+rand(-120,120)));w.wait=rand(2,8)}}
      else{w.moving=true;w.dir=d>0?1:-1;
        if((w.p.ds||0)>=3&&(snap.net||0)>=10&&Math.abs(d)>60&&!w.ride)w.ride=true;
        w.x+=Math.sign(d)*Math.min(Math.abs(d),(w.ride?90:w.chase?34:12)*dt);if(Math.abs(w.tx-w.x)<1)w.ride=false}
    }
    // now and then a word in their language, or a sound
    w.nextSay-=dt;if(w.nextSay<=0&&!w.p.sleep&&w.mode!=="nap"){w.nextSay=rand(20,60);if(!w.p.need&&Math.random()<.6){w.say=w.p.word&&Math.random()<.6?w.p.word:pick(["פיפ!","♪","בלופ","מי?","הה"]);w.sayT=2.5}}
    if(w.ride&&w.mode==="walk"){const dc=w.p.dc||"#5dffb0";for(let i=0;i<4;i++){g.globalAlpha=1-i*.25;R(w.x-w.dir*i*3-1,H-3,2,2,dc);g.globalAlpha=1}if(w.el)w.el.hidden=true;continue}
    w.ride=false;
    drawPip(w,t);
  }
  fxTick(dt);
  if(!ball)for(const w of list)w.chase=false;
  if(breakSign){breakSign.t+=dt;if(breakSign.t>90)breakSign=null}
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
function hitBall(e){if(!ball)return false;const x=e.clientX/S,y=e.clientY/S,by=H-3-ball.h-1;return Math.abs(x-ball.x)<5&&Math.abs(y-by)<5}
function hit(e){const x=e.clientX/S,y=e.clientY/S;for(const w of walkers.values()){const base=H-2-w.y;if(Math.abs(x-w.x)<8&&y>base-26&&y<base+3)return w}return null}
let over=false;
function setOver(o){if(o!==over){over=o;pipDesktop.buddyMouse(o);c.style.cursor=o?"grab":"default"}}
addEventListener("mousemove",e=>{
  mouse={x:e.clientX,y:e.clientY,t:performance.now()};
  const w=hit(e);setOver(!!w||!!drag||hitBall(e)||!!menu);
  if(drag&&drag.ball){const nx=e.clientX/S,nh=Math.max(0,H-3-e.clientY/S);const now=performance.now(),dtm=Math.max(16,now-drag.t)/1000;ball.vx=(nx-ball.x)/dtm*.6;ball.vh=(nh-ball.h)/dtm*.6;ball.x=nx;ball.h=nh;drag.t=now;return}
  if(drag){if(Math.abs(e.clientX-drag.sx)+Math.abs(e.clientY-drag.sy)>6)drag.moved=true;return}
  if(w&&!w.p.sleep&&performance.now()-lastHover>1500){lastHover=performance.now();w.hop=.4}
});
addEventListener("mouseleave",()=>{if(!drag)setOver(false)});
addEventListener("contextmenu",e=>{e.preventDefault();const w=hit(e);if(w)openMenu(w);else closeMenu()});
addEventListener("mousedown",e=>{if(e.button===2)return;if(menu&&!e.target.closest(".menu"))closeMenu();if(hitBall(e)){drag={ball:true,t:performance.now()};return}const w=hit(e);if(!w)return;drag={w,sx:e.clientX,sy:e.clientY,moved:false};c.style.cursor="grabbing"});
addEventListener("mouseup",e=>{
  if(!drag)return;const d=drag;drag=null;c.style.cursor="grab";
  if(d.ball){tone(600,.08,"triangle",.08);return}
  if(d.moved){d.w.tx=d.w.x;tone(700,.12,"sine",.1);return}
  const w=d.w;
  if(breakSign&&breakSign.w===w){breakSign=null;for(const o of walkers.values())o.hop=.6;tone(660,.2,"triangle",.12);setTimeout(()=>tone(880,.2,"triangle",.12),150);pipDesktop.buddyCommand({type:"break"});return}
  clearTimeout(clickT);clickT=setTimeout(()=>{w.hop=.6;chirp(w.p);pipDesktop.buddyCommand({type:"tap",id:w.p.id});if(w.p.need)w.p.need=null},220);
});
let clickT=null;
addEventListener("dblclick",e=>{const w=hit(e);if(!w)return;clearTimeout(clickT);pipDesktop.buddyCommand({type:"open",id:w.p.id})});
</script>
